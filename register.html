<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="css/register.css">
</head>
<body class="register-page">

    <a href="index.html" class="back-to-site">← На главную</a>

    <input type="checkbox" id="form-trigger" class="form-toggle-input">

    <div class="auth-card">
        
        <div class="auth-screen form-screen">
            <h1 class="auth-title">Регистрация</h1>
            <p class="auth-subtitle">предрегистрация аккаунта</p>
            
            <form action="#" onsubmit="return false;">
                <div class="input-group">
                    <input type="text" required placeholder=" ">
                    <label>Имя пользователя</label>
                </div>
                <div class="input-group">
                    <input type="email" required placeholder=" ">
                    <label>E-mail</label>
                </div>
                <div class="input-group">
                    <input type="password" required placeholder=" ">
                    <label>Пароль</label>
                </div>

                <label for="form-trigger" class="action-btn submit-label-btn">
                    Зарегистрироваться
                </label>
            </form>
        </div>

        <div class="auth-screen success-screen">
            <div class="success-icon">✓</div>
            <h2 class="success-title">Заявка передана</h2>
            <p class="success-text">Ваша заявка на регистрацию успешно передана владельцам сайта. Пожалуйста, ожидайте подтверждения.</p>
            
            <a href="index.html" class="action-btn back-home-btn">
                На главную
            </a>
        </div>

    </div>

</body>
</html>
