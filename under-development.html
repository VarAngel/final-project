<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Раздел в разработке — JapanWay</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/under-development.css">
</head>
<body>

<main class="dev-container">
    <div class="dev-content">
        <div class="dev-icon-wrapper">
            <span class="dev-jap-char">準備中</span>
            <div class="dev-graphic">
                <span class="emoji-crane">🏗️</span>
                <a href="404.html" class="emoji-sakura">🌸</a>
            </div>
        </div>
        
        <span class="jap-subtitle">まもなく公開</span>
        <h1 class="dev-title">Раздел в разработке</h1>
        <p class="dev-text">Приготовление контента...</p>
        
        <div class="dev-actions">
            <a href="index.html" class="action-btn">На главную</a>
        </div>
    </div>
</main>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const variations = [
        {
            jap: "桜の蕾",
            title: "Контент еще набирает цвет",
            text: "Как бутоны сакуры бережно ждут своего сезона, так и мы поливаем строками кода этот раздел. Совсем скоро он распустится во всей красе!"
        },
        {
            jap: "新ルート",
            title: "Синкансэн уже разгоняется",
            text: "Мы укладываем последние рельсы, протираем лобовое стекло поезда и упаковываем чемоданы с крутыми гайдами. Будьте готовы к отправлению."
        },
        {
            jap: "手作り",
            title: "Мастера наводят финальный глянец",
            text: "Скрупулезно, как японские кузнецы, мы выковываем вручную каждую деталь этой страницы. Самурайское терпение обязательно вознаграждается."
        }
    ];

    const randomIndex = Math.floor(Math.random() * variations.length);
    const chosen = variations[randomIndex];

    document.querySelector(".jap-subtitle").textContent = chosen.jap;
    document.querySelector(".dev-title").textContent = chosen.title;
    document.querySelector(".dev-text").textContent = chosen.text;
});
</script>

</body>
</html>
