<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Маршрут потерян</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/404.css">
</head>
<body>

<header class="main-header" style="opacity: 0; pointer-events: none; visibility: hidden;"></header>

<main class="error-container" id="404-container">
    <div class="error-steps-badge">Пройдено шагов по межстраничью: <span id="step-count">1</span></div>

    <div class="error-box">
        <div class="error-content">
            <h1 class="error-code">404</h1>
            <span class="jap-subtitle">接続エラー</span>
            <h2 class="error-title">Загрузка...</h2>
            <p class="error-text">Ищем правильное направление в тумане...</p>
        </div>
        
        <div class="error-actions">
            <a href="index.html" class="action-btn error-home-btn btn-disabled" style="pointer-events: none;">Синхронизация...</a>
            <a href="#" id="shuffle-btn" class="action-btn shuffle-btn">Испытать удачу 🌸</a>
        </div>
    </div>
</main>

<script src="js/404.js"></script>
</body>
</html>
